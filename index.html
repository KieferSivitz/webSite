<html style="background-color: black">
    <head>
        <!-- For inquiries or more information about me, google Kiefer Sivitz. -->
        <title>Hey!</title>
        <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@latest/dist/confetti.browser.min.js"></script>
        <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
        <script>
            var duration = 15 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };
            
            function randomInRange(min, max) {
              return Math.random() * (max - min) + min;
            }
            
            var interval = setInterval(function() {
              var timeLeft = animationEnd - Date.now();
            
              if (timeLeft <= 0) {
                return clearInterval(interval);
              }
            
              var particleCount = 50 * (timeLeft / duration);
              // since particles fall down, start a bit higher than random
              confetti({ ...defaults, particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } });
              confetti({ ...defaults, particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } });
            }, 250);
        </script>
    </head>
    <body style="display:flex">
        <input type="image" src="smiley.png" style="margin: 0 auto; max-width: 100%; max-height: 100%; object-fit: contain; outline-style: none;" onclick="buttonClick()" />
    </body>
</html>
